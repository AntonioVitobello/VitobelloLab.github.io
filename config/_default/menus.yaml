# Navigation Links
#   To link a homepage widget, specify the URL as a hash `#` followed by the filename of the
#   desired widget in your `content/home/` folder.
#   The weight parameter defines the order that the links will appear in.

main:
  - name: Research
    url: /#research
    weight: 10

  - name: Publications
    url: /#publications
    weight: 20

  - name: Projects
    url: /#projects
    weight: 30

  - name: People
    url: /#people
    weight: 40

  - name: News
    url: /#news
    weight: 50

  - name: Join us
    url: /#join-us
    weight: 60
