name: Fix Publication Dates

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix-dates:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fix publication dates
        run: |
          find content/publications -type f -name "index.md" -print0 | \
          xargs -0 sed -i -E 's/^date: ([0-9]{4}-[0-9]{2})$/date: \1-01/'

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add content/publications

          if git diff --cached --quiet; then
            echo "No publication dates needed fixing."
          else
            git commit -m "Fix publication date format"
            git push
          fi
          
