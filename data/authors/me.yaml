bio: |
  Antonio Vitobello is Professor of Medical Genetics at Université Bourgogne Europe and a clinical genomics specialist at Dijon University Hospital. His research focuses on how genetic variation disrupts gene regulation and contributes to rare and developmental disorders. His work combines human genomics with functional approaches to uncover disease mechanisms and resolve unsolved diagnoses. He has published over 140 scientific articles and is passionate about bridging genomic discovery with molecular biology and clinical genetics.

